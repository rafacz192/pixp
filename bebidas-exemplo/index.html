<style>
  :root {
    --fundo: #f8efee;
    --papel: #ffffff;
    --linha: #dfc8c6;
    --texto: #2b1818;
    --suave: #67504f;
    --principal: #d7141a;
    --borda: #d7141a;
    --texto-botao: #ffffff;
    --tinta: #d7141a;
    --detalhe: #d7141a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 420px; margin: 0 auto; padding: 48px 24px 56px; }
  header { text-align: center; margin-bottom: 36px; }
  .logo { display: block; width: auto; height: auto; max-width: min(100%, 280px); max-height: 96px; margin: 0 auto 18px; object-fit: contain; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  #copiar {
    display: block;
    width: 100%;
    min-height: 62px;
    padding: 8px 16px;
    border: 2px solid var(--borda);
    border-radius: 14px;
    background: var(--principal);
    color: var(--texto-botao);
    font-size: 18px;
    font-weight: 650;
    line-height: 1.2;
    text-wrap: balance;
    transition: transform 120ms ease, background-color 160ms ease, color 160ms ease;
  }
  #copiar:active { transform: scale(0.98); }
  #copiar.ok { background: var(--papel); color: var(--tinta); font-size: 16px; }
  .valor { margin: 14px 0 0; font-size: 15px; color: var(--suave); text-align: center; }
  .chave {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    column-gap: 16px;
    width: 100%;
    margin: 36px 0 0;
    padding: 16px 0;
    border: 0;
    border-top: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
    background: none;
    text-align: left;
  }
  .chave .rotulo { grid-column: 1; font-size: 14px; color: var(--suave); }
  .chave strong {
    grid-column: 1;
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .chave .acao { grid-column: 2; grid-row: 1 / span 2; font-size: 15px; font-weight: 600; color: var(--detalhe); }
  .confira { margin: 12px 0 0; font-size: 15px; color: var(--suave); }
  .confira b { color: var(--texto); font-weight: 600; }
  figure { margin: 44px auto 0; max-width: 200px; text-align: center; }
  .qr { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
  .qr svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 10px; font-size: 14px; color: var(--suave); }
  @media (prefers-reduced-motion: reduce) { #copiar { transition: none; } }
</style>

<script>
  function copiarAntigo(texto) {
    var campo = document.createElement('textarea');
    campo.value = texto;
    campo.setAttribute('readonly', '');
    campo.style.position = 'fixed';
    campo.style.opacity = '0';
    document.body.appendChild(campo);
    campo.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(campo);
    return ok;
  }
  function copiar(texto, feito) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(feito, function () { if (copiarAntigo(texto)) feito(); });
    } else if (copiarAntigo(texto)) {
      feito();
    }
  }
  function aoCopiar(botao, alvo, texto, classe) {
    var original = alvo.textContent;
    var timer;
    botao.addEventListener('click', function () {
      copiar(botao.dataset.copia, function () {
        alvo.textContent = texto;
        if (classe) botao.classList.add(classe);
        clearTimeout(timer);
        timer = setTimeout(function () {
          alvo.textContent = original;
          if (classe) botao.classList.remove(classe);
        }, 3000);
      });
    });
  }
  var botao = document.getElementById('copiar');
  var chave = document.getElementById('chave');
  aoCopiar(botao, botao, 'Copiado — agora cole no app do banco', 'ok');
  aoCopiar(chave, chave.querySelector('.rotulo'), 'Chave copiada');
</script>
